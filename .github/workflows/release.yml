name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release tag
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME no coincide con VERSION ($VERSION)." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        run: |
          : "${APPLE_CERTIFICATE_P12_BASE64:?Falta el secreto APPLE_CERTIFICATE_P12_BASE64}"
          : "${APPLE_CERTIFICATE_PASSWORD:?Falta el secreto APPLE_CERTIFICATE_PASSWORD}"
          : "${DEVELOPER_ID_APPLICATION:?Falta el secreto DEVELOPER_ID_APPLICATION}"
          : "${APPLE_API_KEY_P8_BASE64:?Falta el secreto APPLE_API_KEY_P8_BASE64}"
          : "${APPLE_API_KEY_ID:?Falta el secreto APPLE_API_KEY_ID}"
          : "${APPLE_API_ISSUER_ID:?Falta el secreto APPLE_API_ISSUER_ID}"

          KEYCHAIN_PATH="$RUNNER_TEMP/gdw-vault-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "CERTIFICATE_PATH=$CERTIFICATE_PATH"
          } >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          if ! grep -Fq "$DEVELOPER_ID_APPLICATION" <<< "$IDENTITIES"; then
            echo "El certificado importado no contiene la identidad solicitada." >&2
            exit 1
          fi

      - name: Build universal app
        run: GDW_BUILD_ARCHS="arm64 x86_64" ./build.sh

      - name: Sign, notarize, and package
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/GDW Vault.app"
          APP_BINARY="$APP_PATH/Contents/MacOS/GDW Vault"
          scripts/sign-app.sh "$APP_PATH" "$DEVELOPER_ID_APPLICATION"

          ARCHS="$(lipo -archs "$APP_BINARY")"
          grep -qw arm64 <<< "$ARCHS"
          grep -qw x86_64 <<< "$ARCHS"

          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"

          NOTARY_ZIP="$RUNNER_TEMP/GDW-Vault-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"

          DIST_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$DIST_DIR"
          DMG_NAME="GDW-Vault-$VERSION-universal.dmg"
          ZIP_NAME="GDW-Vault-$VERSION-universal.zip"
          DMG_STAGE="$RUNNER_TEMP/dmg-stage"
          mkdir -p "$DMG_STAGE"
          ditto "$APP_PATH" "$DMG_STAGE/GDW Vault.app"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname "GDW Vault" \
            -srcfolder "$DMG_STAGE" \
            -ov -format UDZO \
            "$DIST_DIR/$DMG_NAME"
          xcrun notarytool submit "$DIST_DIR/$DMG_NAME" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DIST_DIR/$DMG_NAME"

          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" "$DIST_DIR/$ZIP_NAME"
          (
            cd "$DIST_DIR"
            shasum -a 256 "$DMG_NAME" "$ZIP_NAME" > SHA256SUMS.txt
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$DIST_DIR/$DMG_NAME" \
              "$DIST_DIR/$ZIP_NAME" \
              "$DIST_DIR/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$DIST_DIR/$DMG_NAME" \
              "$DIST_DIR/$ZIP_NAME" \
              "$DIST_DIR/SHA256SUMS.txt" \
              --verify-tag \
              --title "GDW Vault $VERSION" \
              --generate-notes
          fi

      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "${CERTIFICATE_PATH:-$RUNNER_TEMP/developer-id.p12}"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID:-}.p8"
